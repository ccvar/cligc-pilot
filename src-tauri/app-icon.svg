<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS 图标网格：1024 画布，圆角主体 824×824 居中（四周 100px 透明边距），无投影。
       设计稿在 100 网格里画（主体 6..94），这里整体映射到 824 主体。字形：30° 斜置一长一短双柱，绿色渐变。 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6be09a"/>
      <stop offset="1" stop-color="#18a058"/>
    </linearGradient>
  </defs>
  <g transform="translate(100 100) scale(9.363636) translate(-6 -6)">
    <rect x="6" y="6" width="88" height="88" rx="19.8" fill="#fff"/>
    <g transform="translate(3.5 0) rotate(30 50 50)">
      <rect x="35" y="24" width="13" height="52" rx="6.5" fill="url(#g)"/>
    <rect x="53" y="40" width="13" height="36" rx="6.5" fill="url(#g)"/>
    </g>
  </g>
</svg>
